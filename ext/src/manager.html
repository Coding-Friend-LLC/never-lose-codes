<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Never Lose Codes</title>
<link rel="icon" href="../icons/32.png">
<link rel="stylesheet" href="ui.css">
<style>
  .app { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
  nav { border-right: 1px solid var(--border); background: var(--surface); padding: 18px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; font-weight: 750; font-size: 15px; }
  .brand img { width: 28px; height: 28px; }
  nav a { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 550; }
  nav a:hover { background: var(--surface-2); }
  nav a.on { background: var(--brand-soft); color: var(--brand); }
  nav .count { font-size: 12px; color: var(--muted); }
  nav .guard { margin-top: auto; padding: 12px; border-radius: var(--radius); background: var(--surface-2); }
  main { padding: 26px 32px 60px; max-width: 900px; width: 100%; }
  h2 { margin: 0 0 14px; font-size: 21px; letter-spacing: -.01em; }
  .stack { display: grid; gap: 12px; }
  .card.pad { padding: 18px; }
  .rk { font: 700 24px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .06em; background: var(--surface-2); border: 2px dashed var(--brand); border-radius: 12px; padding: 16px 18px; text-align: center; user-select: all; word-break: break-all; }
  .steps { display: flex; gap: 8px; margin-bottom: 16px; }
  .steps span { flex: 1; height: 5px; border-radius: 9px; background: var(--border); }
  .steps span.on { background: var(--brand); }
  input.f, textarea.f, select.f { width: 100%; height: 38px; border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; background: var(--surface); }
  textarea.f { height: auto; padding: 8px 10px; }
  label.l, div.l { display: grid; gap: 4px; font-size: 13px; font-weight: 650; color: var(--muted); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .acc { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .acc .code { font: 700 22px ui-monospace, Menlo, Consolas, monospace; color: var(--brand); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
  .opt { padding: 16px; text-align: left; cursor: pointer; display: grid; gap: 4px; }
  .opt:hover { border-color: var(--brand); }
  .opt b { font-size: 15px; }
  .drop { border: 2px dashed var(--border); border-radius: var(--radius); padding: 26px; text-align: center; }
  .drop.over { border-color: var(--brand); background: var(--brand-soft); }
  video { width: 100%; max-width: 420px; border-radius: 12px; background: #000; }
  .preview { display: grid; gap: 6px; max-height: 360px; overflow: auto; }
  .preview label { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
  .err { color: var(--warn); min-height: 18px; font-size: 13px; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } nav { position: static; height: auto; flex-direction: row; flex-wrap: wrap; } nav .guard { display: none; } main { padding: 16px; } .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand"><img src="../icons/48.png" alt=""> Never Lose Codes</div>
    <a href="#codes" data-view="codes">Your codes <span class="count" id="c-codes"></span></a>
    <a href="#add" data-view="add">Add account</a>
    <a href="#shield" data-view="shield">🛡 Shield</a>
    <a href="#export" data-view="export">Move to phone</a>
    <a href="#trash" data-view="trash">Trash <span class="count" id="c-trash"></span></a>
    <a href="#settings" data-view="settings">Settings</a>
    <a href="#plan" data-view="plan">Plan <span class="count" id="c-plan"></span></a>
    <div class="guard" id="guard"></div>
  </nav>
  <main id="main"></main>
</div>
<script src="../vendor/jsQR.js"></script>
<script src="../vendor/qrcode-generator.js"></script>
<script type="module" src="manager.js"></script>
</body>
</html>
